name: Fetch public neural-operator slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve an archived copy of the official PDF
        shell: bash
        run: |
          cat > fetch_pdf.py <<'PY'
          import gzip, json, ssl, sys, urllib.parse, urllib.request
          from pathlib import Path

          OUT = Path("23-neural-operators.pdf")
          TARGETS = [
              "https://flowlab.groups.et.byu.net/me595r/slides/23-neural-operators.pdf",
              "http://flowlab.groups.et.byu.net/me595r/slides/23-neural-operators.pdf",
          ]
          UA = "Mozilla/5.0"
          CTX = ssl.create_default_context()

          def fetch(url, timeout=15, headers=None):
              h = {"User-Agent": UA, "Accept": "*/*"}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=timeout, context=CTX) as r:
                  return r.read()

          def save(blob, source):
              pos = blob.find(b"%PDF-")
              if pos < 0:
                  return False
              pdf = blob[pos:]
              eof = pdf.rfind(b"%%EOF")
              if eof >= 0:
                  pdf = pdf[:eof + 5]
              if len(pdf) < 10000:
                  return False
              OUT.write_bytes(pdf)
              print(f"SUCCESS {source}: {len(pdf)} bytes")
              return True

          # Common Crawl first: the origin itself currently times out from many networks.
          collections = json.loads(fetch("https://index.commoncrawl.org/collinfo.json", 20))
          for collection in collections[:30]:
              api = collection.get("cdx-api")
              if not api:
                  continue
              for original in TARGETS:
                  q = api + "?url=" + urllib.parse.quote(original, safe="") + "&output=json&filter=status:200&limit=10"
                  try:
                      lines = fetch(q, 15).decode("utf-8", "replace").splitlines()
                  except Exception as e:
                      print("index", collection.get("id"), e)
                      continue
                  for line in lines:
                      try:
                          rec = json.loads(line)
                          start, length = int(rec["offset"]), int(rec["length"])
                          warc_url = "https://data.commoncrawl.org/" + rec["filename"]
                          raw = fetch(warc_url, 30, {"Range": f"bytes={start}-{start + length - 1}"})
                          try:
                              raw = gzip.decompress(raw)
                          except Exception:
                              pass
                          if save(raw, "Common Crawl " + str(collection.get("id"))):
                              sys.exit(0)
                      except Exception as e:
                          print("record", e)

          # Internet Archive fallback.
          for original in TARGETS:
              params = urllib.parse.urlencode({
                  "url": original,
                  "output": "json",
                  "filter": "statuscode:200",
                  "fl": "timestamp,original",
                  "collapse": "digest",
                  "limit": "50",
              })
              try:
                  rows = json.loads(fetch("https://web.archive.org/cdx/search/cdx?" + params, 20))
              except Exception as e:
                  print("wayback index", e)
                  continue
              for ts, archived_original in reversed(rows[1:]):
                  try:
                      replay = f"https://web.archive.org/web/{ts}id_/{archived_original}"
                      if save(fetch(replay, 30), replay):
                          sys.exit(0)
                  except Exception as e:
                      print("wayback replay", e)

          raise SystemExit("No archived PDF copy found")
          PY

          python3 fetch_pdf.py
          pdfinfo 23-neural-operators.pdf | sed -n '1,25p'
          sha256sum 23-neural-operators.pdf | tee SHA256SUMS.txt

      - name: Upload slides
        uses: actions/upload-artifact@v4
        with:
          name: neural-operators-slides
          path: |
            23-neural-operators.pdf
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
